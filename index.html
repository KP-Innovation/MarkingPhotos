<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ป้ายเลขที่งาน</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f6f8fc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141b26" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ป้ายเลขที่งาน">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="assets/fonts/anuphan-thai.woff2" as="font" type="font/woff2" crossorigin>
<!-- ?v= ต้องตรงกับ BUILD ใน sw.js เสมอ ไม่งั้นเครื่องที่ติดตั้งแอปไว้จะค้างโค้ดเก่า -->
<link rel="stylesheet" href="style.css?v=20260825b">
<script>
/*
 * ตัวกู้โค้ดค้าง — ต้องอยู่ในไฟล์นี้เท่านั้น ห้ามย้ายไป app.js
 *
 * index.html ถูกดึงจากเน็ตใหม่เสมอ (service worker ใช้ network-first กับ navigation)
 * แต่ service worker รุ่นเก่าจับคู่ไฟล์แบบ ignoreSearch คือมองข้าม ?v= ทิ้ง
 * มันจึงหยิบ app.js ตัวเก่าในแคชมาเสิร์ฟให้ ทั้งที่หน้านี้เป็นตัวใหม่แล้ว
 * ผลคือแอปค้างโค้ดเก่าแบบผู้ใช้ไม่มีทางรู้ตัว ต้องไปล้างเครื่องเองซึ่งไม่ควร
 *
 * ถ้าโค้ดที่โหลดมาเป็นคนละรุ่นกับหน้านี้ ให้ล้างแคชแล้วโหลดใหม่ให้เอง หนึ่งครั้งต่อหนึ่งรอบเปิด
 */
(function () {
  var BUILD = '20260825b';
  window.__BUILD = BUILD;

  window.addEventListener('load', function () {
    if (window.MarkingPhotosBuild === BUILD) return;
    try {
      if (sessionStorage.getItem('mp-recover') === BUILD) return;   // กู้ไปแล้วรอบนึง อย่าวนซ้ำ
      sessionStorage.setItem('mp-recover', BUILD);
    } catch (err) { return; }

    var jobs = [];
    if (window.caches) {
      jobs.push(caches.keys().then(function (keys) {
        return Promise.all(keys.map(function (k) { return caches.delete(k); }));
      }).catch(function () {}));
    }
    // ถอน service worker ทิ้งเลย ไม่ใช่แค่สั่ง update
    // เพราะตัวที่ค้างอยู่คือตัวที่กำลังยัดไฟล์เก่ามาให้ ต้องเอามันออกจากทางก่อน
    // โหลดรอบถัดไปจะวิ่งตรงไปที่เน็ต แล้ว app.js ตัวใหม่จะลงทะเบียนตัวใหม่ให้เอง
    if (navigator.serviceWorker) {
      jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
        return Promise.all(regs.map(function (r) { return r.unregister(); }));
      }).catch(function () {}));
    }
    var go = function () { location.replace(location.pathname + '?r=' + Date.now()); };
    Promise.all(jobs).then(go, go);
  });
})();
</script>
</head>
<body>

<!-- ---------- หน้า 1: รหัสเลขที่งาน ---------- -->
<section id="screen-code" class="screen is-active">
  <div class="sheet">
    <header class="head">
      <h1>ป้ายเลขที่งาน</h1>
      <p class="lead">พิมพ์เลขงาน ถ่ายรูป แล้ววางป้ายลงบนภาพก่อนบันทึก</p>
    </header>

    <label class="code-field">
      <span class="code-field__label">เลขที่งาน</span>
      <input id="in-code" type="text" inputmode="text" autocapitalize="characters"
             autocomplete="off" autocorrect="off" spellcheck="false"
             maxlength="20" placeholder="LP-2609-0045">
    </label>
    <p id="code-note" class="note"></p>

    <div id="plate-preview" class="plate-preview"></div>

    <div class="actions">
      <button id="btn-native" type="button" class="btn btn--primary">
        ถ่ายรูป
        <small>ใช้กล้องของเครื่องเต็มคุณภาพ แล้วค่อยวางป้าย</small>
      </button>
      <button id="btn-pick" type="button" class="btn btn--soft">
        เลือกรูปที่มีอยู่แล้ว
        <small>จากอัลบั้มหรือโฟลเดอร์ในเครื่อง</small>
      </button>
    </div>

    <input id="file-native" type="file" accept="image/*" capture="environment" hidden>
    <input id="file-pick" type="file" accept="image/*" hidden>

    <!-- ไว้ดูว่าเครื่องนี้กำลังใช้โค้ดรุ่นไหน และบังคับดึงรุ่นใหม่ได้เองโดยไม่ต้องล้างเครื่อง -->
    <p class="build">
      <span id="build-id"></span>
      <button id="btn-update" type="button" class="linkbtn">ตรวจอัปเดต</button>
      <button id="btn-hardreset" type="button" class="linkbtn">ล้างข้อมูลแอป</button>
    </p>
  </div>
</section>

<!-- ---------- หน้า 2: ตรวจรูป / ตั้งชื่อ / บันทึก ---------- -->
<section id="screen-review" class="screen screen--dark">
  <header class="bar">
    <button id="btn-review-back" type="button" class="icon-btn" aria-label="ย้อนกลับ">‹</button>
    <span id="review-code" class="bar__code bar__code--plain"></span>
    <span class="bar__spacer"></span>
  </header>

  <div class="stage">
    <div id="review-shot" class="shot">
      <div id="review-frame" class="frame">
        <canvas id="review-canvas"></canvas>
        <div id="review-plate" class="plate-layer"></div>
      </div>
      <div id="review-band" class="band" hidden></div>
    </div>
    <p class="hint">ลากรูปเพื่อเลื่อนกรอบ · หยิกสองนิ้วเพื่อซูม</p>
  </div>

  <div class="controls">
    <div class="slider">
      <span>สัดส่วนภาพ</span>
      <div id="review-aspect" class="chips"></div>
    </div>
    <div id="review-mode" class="seg" role="group" aria-label="ตำแหน่งป้าย">
      <button type="button" class="seg__btn" data-mode="band">ป้ายใต้ภาพ</button>
      <button type="button" class="seg__btn" data-mode="inside">ป้ายในภาพ</button>
    </div>
    <label class="slider">
      <span id="lb-review-size">ขนาดป้าย</span>
      <input id="sl-review-size" type="range" min="0.15" max="0.95" step="0.01" value="0.55">
    </label>
  </div>

  <div class="typebar">
    <div class="typebar__head">
      <span>ประเภทรูป</span>
      <span id="name-preview" class="typebar__name"></span>
    </div>
    <div id="type-chips" class="chips"></div>
  </div>

  <!-- เฉพาะเบราว์เซอร์บนคอมที่เขียนไฟล์ลงโฟลเดอร์ได้เอง (Chrome/Edge) -->
  <p id="savedir" class="savedir" hidden>
    <span class="savedir__label">บันทึกลง</span>
    <span id="savedir-name" class="savedir__name">ถามทุกครั้ง</span>
    <button id="btn-savedir" type="button" class="linkbtn">ตั้งโฟลเดอร์ประจำ</button>
    <button id="btn-savedir-clear" type="button" class="linkbtn" hidden>เลิกใช้</button>
  </p>

  <div class="actions actions--row actions--tight">
    <button id="btn-rotate" type="button" class="btn btn--ghost">หมุน 90°</button>
    <button id="btn-crop-reset" type="button" class="btn btn--ghost">กรอบกลาง</button>
    <button id="btn-auto" type="button" class="btn btn--ghost">จัดตำแหน่ง</button>
  </div>
  <div class="actions actions--row actions--bottom">
    <button id="btn-save" type="button" class="btn btn--primary">บันทึกรูป</button>
  </div>
</section>

<div id="toast" class="toast" hidden></div>

<!-- ทางออกฉุกเฉิน: ถ้าแอปพังจนไปต่อไม่ได้ ต้องกดล้างแล้วเริ่มใหม่ได้เสมอ -->
<div id="fatal" class="fatal" hidden>
  <p class="fatal__title">แอปมีปัญหา</p>
  <p id="fatal-msg" class="fatal__msg"></p>
  <button id="btn-reset" type="button" class="btn btn--primary">ล้างข้อมูลแอปแล้วเริ่มใหม่</button>
</div>

<script src="js/plate.js?v=20260825b"></script>
<script src="js/autoplace.js?v=20260825b"></script>
<script src="js/app.js?v=20260825b"></script>
</body>
</html>
