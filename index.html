<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ป้ายเลขที่งาน</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f6f8fc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141b26" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ป้ายเลขที่งาน">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="assets/fonts/anuphan-thai.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ---------- หน้า 1: รหัสเลขที่งาน ---------- -->
<section id="screen-code" class="screen is-active">
  <div class="sheet">
    <header class="head">
      <h1>ป้ายเลขที่งาน</h1>
      <p class="lead">พิมพ์เลขงาน แล้วป้ายจะไปลอยอยู่ในกล้องให้เห็นตอนถ่าย</p>
    </header>

    <label class="code-field">
      <span class="code-field__label">เลขที่งาน</span>
      <input id="in-code" type="text" inputmode="text" autocapitalize="characters"
             autocomplete="off" autocorrect="off" spellcheck="false"
             maxlength="20" placeholder="LP-2609-0045">
    </label>
    <p id="code-note" class="note"></p>

    <div id="plate-preview" class="plate-preview"></div>

    <div class="actions">
      <button id="btn-live" type="button" class="btn btn--primary">
        เปิดกล้อง
        <small>เห็นป้ายสด วางตำแหน่งได้ตั้งแต่ตอนเล็ง</small>
      </button>
      <button id="btn-native" type="button" class="btn btn--soft">
        ถ่ายด้วยกล้องเครื่อง
        <small>ภาพคมกว่า แล้วค่อยวางป้าย</small>
      </button>
      <button id="btn-pick" type="button" class="btn btn--ghost">เลือกรูปที่มีอยู่แล้ว</button>
    </div>

    <input id="file-native" type="file" accept="image/*" capture="environment" hidden>
    <input id="file-pick" type="file" accept="image/*" hidden>
  </div>
</section>

<!-- ---------- หน้า 2: กล้องสด ---------- -->
<section id="screen-camera" class="screen screen--dark">
  <header class="bar">
    <button id="btn-cam-back" type="button" class="icon-btn" aria-label="ย้อนกลับ">‹</button>
    <button id="cam-code" type="button" class="bar__code" title="แตะเพื่อแก้เลขงาน"></button>
    <button id="btn-flip" type="button" class="icon-btn" aria-label="สลับกล้อง">⟳</button>
  </header>

  <div class="stage">
    <div id="cam-frame" class="frame">
      <video id="video" playsinline autoplay muted></video>
      <div id="cam-plate" class="plate-layer" hidden></div>
      <div class="frame__guide"></div>
    </div>
    <p id="cam-error" class="error"></p>
  </div>

  <div class="controls">
    <label class="slider">
      <span>ขนาดป้าย</span>
      <input id="sl-size" type="range" min="0.15" max="0.95" step="0.01" value="0.55">
    </label>
    <label class="slider">
      <span id="lb-zoom">ซูม</span>
      <input id="sl-zoom" type="range" min="1" max="4" step="0.05" value="1">
    </label>
    <label class="slider">
      <span id="lb-exposure">แสง</span>
      <input id="sl-exposure" type="range" min="0.6" max="1.8" step="0.02" value="1">
    </label>
  </div>

  <div class="shutter-row">
    <button id="btn-reset-plate" type="button" class="chip">จัดตำแหน่งป้าย</button>
    <button id="btn-shutter" type="button" class="shutter" aria-label="ถ่ายรูป"></button>
    <button id="btn-torch" type="button" class="chip" hidden>ไฟฉาย</button>
  </div>
</section>

<!-- ---------- หน้า 3: ตรวจรูป / ตั้งชื่อ / บันทึก ---------- -->
<section id="screen-review" class="screen screen--dark">
  <header class="bar">
    <button id="btn-review-back" type="button" class="icon-btn" aria-label="ย้อนกลับ">‹</button>
    <span id="review-code" class="bar__code bar__code--plain"></span>
    <span class="bar__spacer"></span>
  </header>

  <div class="stage">
    <div id="review-frame" class="frame frame--fit">
      <canvas id="review-canvas"></canvas>
      <div id="review-plate" class="plate-layer"></div>
    </div>
  </div>

  <div class="controls">
    <label class="slider">
      <span>ขนาดป้าย</span>
      <input id="sl-review-size" type="range" min="0.15" max="0.95" step="0.01" value="0.55">
    </label>
  </div>

  <div class="typebar">
    <div class="typebar__head">
      <span>ประเภทรูป</span>
      <span id="name-preview" class="typebar__name"></span>
    </div>
    <div id="type-chips" class="chips"></div>
  </div>

  <div class="actions actions--row actions--tight">
    <button id="btn-auto" type="button" class="btn btn--ghost">จัดตำแหน่งอัตโนมัติ</button>
    <button id="btn-again" type="button" class="btn btn--ghost" hidden>ถ่ายต่อ</button>
  </div>
  <div class="actions actions--row actions--bottom">
    <button id="btn-save" type="button" class="btn btn--primary">บันทึกลงอัลบั้ม</button>
  </div>
</section>

<div id="toast" class="toast" hidden></div>

<script src="js/plate.js"></script>
<script src="js/autoplace.js"></script>
<script src="js/app.js"></script>
</body>
</html>
