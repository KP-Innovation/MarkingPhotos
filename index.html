<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ป้ายเลขที่งาน</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#111417">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ป้ายเลขที่งาน">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ---------- หน้า 1: กรอกรหัสเลขที่งาน ---------- -->
<section id="screen-code" class="screen is-active">
  <div class="sheet">
    <h1>ป้ายเลขที่งาน</h1>
    <p class="lead">กรอกรหัสก่อน แล้วป้ายจะไปลอยอยู่ในกล้องให้เห็นตอนถ่าย</p>

    <div id="fields-parts" class="fields">
      <label class="field field--prefix">
        <span>อักษรนำ</span>
        <input id="in-prefix" type="text" inputmode="text" autocapitalize="characters"
               autocomplete="off" spellcheck="false" maxlength="4" placeholder="EM">
      </label>
      <label class="field">
        <span>ปี</span>
        <input id="in-year" type="text" inputmode="numeric" autocomplete="off"
               maxlength="2" placeholder="26">
      </label>
      <label class="field">
        <span>เดือน</span>
        <input id="in-month" type="text" inputmode="numeric" autocomplete="off"
               maxlength="2" placeholder="07">
      </label>
      <label class="field">
        <span>ลำดับ</span>
        <input id="in-running" type="text" inputmode="numeric" autocomplete="off"
               maxlength="4" placeholder="0001">
      </label>
    </div>

    <div id="fields-free" class="fields is-hidden">
      <label class="field field--full">
        <span>พิมพ์รหัสเต็ม</span>
        <input id="in-free" type="text" autocapitalize="characters" autocomplete="off"
               spellcheck="false" placeholder="EM-2607-0001">
      </label>
    </div>

    <button id="btn-toggle-mode" type="button" class="linkish">พิมพ์รหัสเต็มเอง</button>

    <div class="preview-wrap">
      <div id="plate-preview" class="plate-preview"></div>
      <p id="code-error" class="error"></p>
    </div>

    <div class="actions">
      <button id="btn-live" type="button" class="btn btn--primary">
        เปิดกล้อง — เห็นป้ายสด
        <small>วางป้ายได้ตั้งแต่ตอนเล็ง</small>
      </button>
      <button id="btn-native" type="button" class="btn">
        ถ่ายด้วยกล้องเครื่อง
        <small>ภาพคมกว่า แล้วค่อยวางป้าย</small>
      </button>
      <button id="btn-pick" type="button" class="btn btn--ghost">เลือกรูปที่มีอยู่แล้ว</button>
    </div>

    <input id="file-native" type="file" accept="image/*" capture="environment" hidden>
    <input id="file-pick" type="file" accept="image/*" hidden>
  </div>
</section>

<!-- ---------- หน้า 2: กล้องสด ---------- -->
<section id="screen-camera" class="screen">
  <header class="bar">
    <button id="btn-cam-back" type="button" class="icon-btn" aria-label="ย้อนกลับ">‹</button>
    <span id="cam-code" class="bar__code"></span>
    <button id="btn-flip" type="button" class="icon-btn" aria-label="สลับกล้อง">⟳</button>
  </header>

  <div class="stage">
    <div id="cam-frame" class="frame">
      <video id="video" playsinline autoplay muted></video>
      <div id="cam-plate" class="plate-layer" hidden></div>
      <div class="frame__guide"></div>
    </div>
    <p id="cam-error" class="error error--pad"></p>
  </div>

  <div class="controls">
    <label class="slider">
      <span>ขนาดป้าย</span>
      <input id="sl-size" type="range" min="0.15" max="0.95" step="0.01" value="0.55">
    </label>
    <label class="slider">
      <span id="lb-zoom">ซูม</span>
      <input id="sl-zoom" type="range" min="1" max="4" step="0.05" value="1">
    </label>
    <label class="slider">
      <span id="lb-exposure">แสง</span>
      <input id="sl-exposure" type="range" min="0.6" max="1.8" step="0.02" value="1">
    </label>
  </div>

  <div class="shutter-row">
    <button id="btn-reset-plate" type="button" class="chip">จัดตำแหน่งป้าย</button>
    <button id="btn-shutter" type="button" class="shutter" aria-label="ถ่ายรูป"></button>
    <button id="btn-torch" type="button" class="chip" hidden>ไฟฉาย</button>
  </div>
</section>

<!-- ---------- หน้า 3: ตรวจรูป / วางป้าย ---------- -->
<section id="screen-review" class="screen">
  <header class="bar">
    <button id="btn-review-back" type="button" class="icon-btn" aria-label="ย้อนกลับ">‹</button>
    <span id="review-code" class="bar__code"></span>
    <span class="bar__spacer"></span>
  </header>

  <div class="stage">
    <div id="review-frame" class="frame frame--fit">
      <canvas id="review-canvas"></canvas>
      <div id="review-plate" class="plate-layer"></div>
    </div>
    <p id="review-hint" class="hint">ลากป้ายเพื่อย้าย · ใช้สองนิ้วหรือแถบเลื่อนเพื่อย่อ/ขยาย</p>
  </div>

  <div class="controls">
    <label class="slider">
      <span>ขนาดป้าย</span>
      <input id="sl-review-size" type="range" min="0.15" max="0.95" step="0.01" value="0.55">
    </label>
  </div>

  <div class="actions actions--row">
    <button id="btn-auto" type="button" class="btn btn--ghost">จัดตำแหน่งอัตโนมัติ</button>
    <button id="btn-save" type="button" class="btn btn--primary">บันทึกลงอัลบั้ม</button>
  </div>
  <p id="save-note" class="hint hint--pad"></p>
</section>

<div id="toast" class="toast" hidden></div>

<script src="js/plate.js"></script>
<script src="js/autoplace.js"></script>
<script src="js/app.js"></script>
</body>
</html>
